name: CI

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # TODO: golangci-lint is advisory until .golangci.yml is migrated to the v2
      # schema and pinned to a release built with Go 1.26. continue-on-error keeps
      # findings visible without blocking commits. Remove once the v2 setup is
      # verified green in CI.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        continue-on-error: true
        with:
          args: --timeout=5m
          only-new-issues: false

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Run stable test suite
        shell: bash
        run: |
          # cache package currently contains integration-style tests that are flaky
          # in the default unit-test flow. Keep main CI deterministic until those
          # tests are isolated behind explicit tags or fixed in code.
          packages=$(go list ./... | grep -v '^github.com/go-lynx/lynx/cache$')
          go test -v -race -coverprofile=coverage.out -covermode=atomic $packages

      - name: Test CLI module
        working-directory: cmd/lynx
        run: |
          go vet ./...
          go test -race ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build CLI
        working-directory: cmd/lynx
        run: go build -o ../../bin/lynx .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lynx-binaries
          path: bin/

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: lynx-binaries

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
